<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tono - language courses that remember with you</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f6;color:#17191b;font:17px system-ui,sans-serif;letter-spacing:0}
.hero{position:relative;min-height:82vh;display:flex;align-items:end;overflow:hidden;color:white}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.48)}
.hero-copy{position:relative;width:min(820px,100%);padding:48px max(24px,calc((100vw - 820px)/2))}
h1{font-size:clamp(52px,10vw,104px);line-height:1;margin:0 0 16px}.offer{font-size:clamp(22px,3vw,32px);line-height:1.35;max-width:720px;margin:0}
.action{display:inline-flex;margin-top:24px;padding:14px 19px;border-radius:6px;background:#1d816a;color:white;text-decoration:none;font-weight:700}
.courses{padding:34px max(24px,calc((100vw - 820px)/2)) 64px;background:#e7eceb}.courses h2{font-size:28px;margin:0 0 10px}.courses p{line-height:1.55;max-width:680px}
</style>
<main>
  <section class="hero">
    <img src="tono-cover.jpg" alt="Thai curry and jasmine rice">
    <div class="hero-copy">
      <h1>Tono</h1>
      <p class="offer">Native flashcards for learning Thai, with signed courses you can install on iPhone, iPad, and Mac.</p>
      <a class="action" href="/tono/install/com.tedon.tono.course.kookschool-thais-koken/">Open the course catalog</a>
    </div>
  </section>
  <section class="courses">
    <h2>Kookschool - Thais koken</h2>
    <p>A six-lesson reference course with Thai vocabulary, listening cards, explanations, recipes, and licensed public media.</p>
  </section>
</main>
</html>
